<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
   <title>Receita Interativa</title>
</head> 
<body>
    <header>
        <h1>Pão de Queijo Tradicional</h1>

        <p>
            Uma receita tradicional de Minas Gerais:
            crocante por fora e macia por dentro.
        </p>

        <img>
        src="https://via.placeholder.com/400x200?text=Pao+Queijo"
        alt="Pães de Queijo"
        >
    </header>
    <selection>
        <button popovertarget="segredo">
            Ver Segredo do Chef
            </button>

            <div id="segredo" popover>
                <h2>O Segredo da receita</h2>
                <p>
                    Evite adicionar os ovos enquanto a massa ainda estiver muito quente.
                </p>
            </div> 
            </button>
    </selection>
